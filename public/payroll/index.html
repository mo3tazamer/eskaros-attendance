 const L=Object.values(E),ty=['أسبوعي','شهري'].map(t=>{const a=cs.filter(c=>c.type==t),rs=a.flatMap(c=>c.rows);return{n:t,k:a.length,due:sm(rs,'due'),extra:sm(rs,'extra'),adv:tots(rs).adv,net:tots(rs).net}});

 const t2=`<table><tr><th>الموظف</th><th>الأيام</th><th>الاستحقاق</th><th>إضافي</th><th>السلف</th><th>الصافي</th></tr>${L.map(o=>tr([esc(o.name),f(o.days),f(o.due),f(o.extra),f(o.adv),f(o.net)])).join('')}${tr(['<b>الإجمالي</b>',f(sm(L,'days')),f(sm(L,'due')),f(sm(L,'extra')),f(sm(L,'adv')),f(sm(L,'net'))])}</table>`;
 const B={};for(const c of cs)for(const r of c.rows){const k=r.br||'بدون فرع',o=B[k]=B[k]||{due:0,extra:0,adv:0,net:0,n:new Set()};o.due+=r.due;o.extra+=r.extra||0;o.adv+=eff(r).adv;o.net+=eff(r).pay;o.n.add(r.emp)}

 return{cs,t1,t2,t3,L,ty};
}

 try{const r=await fetch('api/ping',{cache:'no-store'});if(!r.ok)return null;await r.json()}catch(e){return null}
